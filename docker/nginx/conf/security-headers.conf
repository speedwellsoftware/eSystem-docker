# Security response headers, shared via include.
#
# nginx `add_header` is NOT additive across levels: any location that declares
# its own add_header (e.g. the .html/.json no-store blocks) silently drops
# every header inherited from http{}/server{}. Every such location must
# therefore re-`include` this file after its own add_header lines.
#
# CSP notes:
#  - script-src keeps 'unsafe-inline'/'unsafe-eval': the esystem authoring
#    editors (TinyMCE 5, FMathEditor with bundled jQuery 1.12 + w2ui 1.4.3)
#    rely on inline scripts and eval(); tightening this needs a nonce/hash
#    CSP project plus editor upgrades. See master/spec/humble/.
#  - The explicit fetch directives (img/connect/media/worker/child-src)
#    mirror the default-src fallback exactly, so they change no behaviour;
#    base-uri and form-action do NOT fall back to default-src and are real
#    hardening.
#  - Cross-Origin-Embedder-Policy is deliberately absent: only needed for
#    SharedArrayBuffer and it would block any cross-origin subresource.
#  - Alt-Svc advertises HTTP/3 on the published HTTPS port ($h3_port is a map
#    in nginx.conf.template). Browsers only honour it over TLS, so the copy on
#    the :80 redirect is inert.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self' data: blob:; base-uri 'self'; form-action 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob:; connect-src 'self' data: blob:; media-src 'self' data: blob:; worker-src 'self' data: blob:; child-src 'self' data: blob:; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
# add_header Alt-Svc 'h3=":$h3_port"; ma=86400' always;
